# Publishes the clickable DEMO (not the real app) to GitHub Pages: nothing is saved, the room data is sample data.
# One-time setup in GitHub: Settings > Pages > Source: "GitHub Actions". Then every push to the branches below (or "Run workflow") updates the demo.
# The demo INCLUDES the songs and voice clips (decided by the owner). They are other people's recordings and are served publicly with the demo:
# clear the rights before wider sharing. To leave them out, add "--no-audio" to the build line below.
name: Publish demo to GitHub Pages
on:
  push:
    branches: [main, claude/new-session-uof3e7]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --disable-warning=ExperimentalWarning --test test/*.test.js
      - run: node --disable-warning=ExperimentalWarning scripts/build-preview.js _site
      - run: touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
